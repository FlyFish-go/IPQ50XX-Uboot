    status: planned
    known: 上游 OpenWrt 有设备树。双系统方式和小米 CR8806 一样。GE PHY 和 SGMII 同时接 QCA8337。
    missing: 原厂 U-Boot 里有 `is_sec_boot_enabled`，安全启动状态必须先查；没有实物备份。
