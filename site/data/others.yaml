# 列在机型页上、但还没有构建的 IPQ50xx 机型。机型页的「规划中」「不打算做」两张表从这里生成。
#   status: planned  规划中。known = 已知情况，missing = 还缺什么（必填）
#   status: wontdo   不打算做。reason = 原因（必填）
# aliases 只用于筛选，不显示。规划中的按离能出构建的远近排，近的在前。
models:
  - name: 小米 AX6000
    aliases: [Xiaomi AX6000]
    status: planned
    known: 上游 OpenWrt 有设备树。双系统方式和小米 CR8806 一样，这部分代码已经有了。内存 512 MiB，串口 1.8 V，部分机器闪存要 ECC 8 位。
    missing: 网络是 GE PHY 加 QCA8081 再接交换芯片，要新写；安全启动状态要先查。
