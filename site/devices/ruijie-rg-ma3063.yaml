id: ruijie-rg-ma3063
order: 30
vendor: 锐捷
name: RG-MA3063
aliases: [RG-MA3063, RG-MA3063 硬件版本 1.00]
soc: IPQ5018
status: verified
family: 锐捷 RG-MA3063
summary: "锐捷 RG-MA3063（硬件 1.00）已实机刷入，冷启动 10 次通过。LED 和按键没有测；和原厂的一个区别是装了本 U-Boot 以后不会自动回退到另一个槽。"
brief: "硬件版本 1.00；不会像原厂那样自动回退"
artifact: ipq5018_ruijie_rg_ma3063
hardware:
  - { label: 闪存, value: "NAND（多种型号，U-Boot 自动识别）" }
  - { label: 主板分类, value: "AP-MP02.1，machid `0x8040000`" }
  - { label: 网络, value: "QCA8337 交换芯片" }
  - { label: 安全启动, value: "样机未开启" }
  - { label: 原厂 LAN 地址, value: "`192.168.10.1`" }
tested:
  - "两份 APPSBL 写入，读回校验一致"
  - "冷启动 10 次通过（串口横幅、交换芯片、内核、rootfs 槽、LAN 都正常）"
  - "BOOTCONFIG：把 rootfs 切到 1 并断电重启，从第二槽启动；切回 0 后字节和备份一致"
  - "救援页：1 号口（GE 口，LAN）能打开；4 号口需要在 U-Boot 里把 `ethact` 设成 `eth1` 才行，一次只能接一个口"
not_tested:
  - "LED、Reset 和 Mesh 按键"
  - "拔网线后救援页自动换口"
  - "MAC 从 ART 读取的路径（样机环境变量里本来就有 MAC）"
  - "硬件版本 V3 / V4 / MA3064：见各自页面"
  - "从原厂 SSH 一键安装"
differences:
  - "**没有自动回退到另一个槽。** 原厂 U-Boot 在每次不被打断的自动启动时，把环境变量 `ipqboot_num` 加一并保存；超过 5 次还没有健康启动，就切换到另一个系统槽并重启，原厂 Linux 在正常启动后把它清零。本 U-Boot 不读也不写 `ipqboot_num`，所以装了本 U-Boot 以后，启动但从不健康的系统不会自动回退，内核崩溃也不会自动恢复，要用救援页处理。"
  - "好处：每次开机不再重写环境分区，少一次闪存磨损，也没有写入过程中断电的风险。原厂系统里清零计数的脚本照常运行，但没有影响；环境里残留的大于 5 的旧值会被忽略。"
  - "**这台机器上不要执行 `bootconfig set all`**：样机上第二套 QSEE、DEVCFG、CDT 是空的，全部切过去会起不来。"
  - "启动时本 U-Boot 会往环境分区写入默认网络变量（IP `192.168.1.1`）。原厂本来每次开机也会写。"
slots:
  mechanism: bootconfig
  note: "原厂用 BOOTCONFIG 选 rootfs 槽。切换槽要断电重启后才生效（SBL 到 SMEM 要重新读）。"
install:
  method: ttl
ttl:
  voltage: 1.8 V
  pins: GPIO28/29
  fdt: "0x4a984004"
  port: 1 号口（GE 口）
notes:
  interrupt: "原厂 U-Boot 的倒计时只有 1 秒。可以在通电前就按住回车不放，看到提示符再松开。"
  rescue: "救援页默认走 1 号口。想用 4 号口，要先在 U-Boot 里执行 `setenv ethact eth1`；一次只接一根网线。"
  verify: "**不要**在这台机器上执行 `bootconfig set all`：样机上第二套 QSEE、DEVCFG、CDT 是空的，全部切过去会起不来。"
rescue:
  how: TTL 截停启动后输入 `httpd`
  address: 192.168.1.1
recovery:
  - 写入前的备份是唯一的退路。救援页「固件更新」可以把备份的分区原样写回。
  - 启动程序本身损坏时，需要 TTL 加 RAM 试跑包重新进救援页，或者用编程器；先到 QQ 群 1131957442 联系维护者。
links:
  - { text: IPQ50XX-Uboot 仓库, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot" }
