  - title: 只读采集设备信息
    body: |
      我们需要分区表、安全启动状态和原厂启动标志来完成适配。采集脚本还在准备中，见[参与收录](/contribute/)。
  - title: 安装 U-Boot
    body: |
      还没有可用版本。实机验证通过后，这里会给出安装包和逐步命令。
    warn: 现在刷入任何第三方 U-Boot 都可能变砖，请等待「已验证」状态。
