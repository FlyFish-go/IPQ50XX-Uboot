id: xiaomi-cr8806
order: 10
vendor: 小米
name: CR8806
aliases: [CR8806, CR8808, CR8809, Redmi AX3000（RA81）]
soc: IPQ5018
status: verified
family: 小米 CR880x
summary: "小米 CR8806 已实机刷入：小米环境变量双系统、网页刷固件、冷启动 10 次通过。按键没有测。CR8808、CR8809、Redmi AX3000 是同硬件，没有实机验证。"
brief: "CR8808 等同硬件机型没有实机验证；按键没测"
artifact: ipq5018_xiaomi_cr8806
hardware:
  - { label: 闪存, value: "NAND（ESMT F50D1G41LB，ECC 4 位；该颗粒 U-Boot 不做串行训练，和原厂一致）" }
  - { label: 主板分类, value: "AP-MP02.1，machid `0x8040000`" }
  - { label: 网络, value: "QCA8337 交换芯片，复位 GPIO26" }
  - { label: 安全启动, value: "样机未开启" }
  - { label: 原厂 LAN 地址, value: "`192.168.31.1`" }
tested:
  - "两份 APPSBL 写入，读回校验一致"
  - "冷启动 10 次通过（走第二套 rootfs，串口横幅、内核、LAN 都正常）"
  - "小米环境变量双系统：读写原厂环境变量、切换 rootfs 槽、原厂系统和 U-Boot 互相读到对方写的环境"
  - "救援页「固件更新」写入另一个槽并切换，写入后启动正常"
  - "UBI 卷写入读回校验，无 UBI、ECC 错误"
not_tested:
  - "Reset、Mesh 按键"
  - "失败启动时「标记失败槽并重启」的路径（只在设计上走通）"
  - "Redmi / CR8808 / CR8809 等别名机型"
  - "从原厂 SSH 一键安装"
warnings:
  - "同一硬件，未实机验证：小米 CR8808、CR8809、Redmi AX3000（RA81，M79 / M81 两版）。第三方 OpenWrt 项目用同一个设备树覆盖这几款，GPIO 和 CR8806 一致，但我们没有看过它们的启动链、分区表和安全启动状态。刷入前先做 RAM 试跑，并核对原厂的 `nvram get model`。"
  - "部分小米机型的零售版可能开启了安全启动，装之前必须确认熔丝是关闭的。"
slots:
  mechanism: xiaomi-env
  note: "原厂用 flag_boot_rootfs 等环境变量在两个 rootfs 之间切换，本项目的 U-Boot 照原厂逻辑读写这些变量，所以原厂系统和 U-Boot 可以互相切换。网页刷固件会写入另一个槽，再切换过去。"
install:
  method: ttl
ttl:
  voltage: 1.8 V
  prompt: "IPQ5018#"
  fdt: "0x4a9d4004"
  port: LAN 口
notes:
  interrupt: "如果通电后串口一个字都没有，可能是原厂关了串口输出：先用 [XMiR-Patcher](https://github.com/openwrt-xiaomi/xmir-patcher) 打开原厂 SSH，执行 `nvram set uart_en=1; nvram set boot_wait=on; nvram commit` 后重启再试。"
  verify: "冷启动后应进入原厂小米系统，地址 `192.168.31.1`。"
shell:
  access: "原厂系统没有现成的 SSH。社区工具 [XMiR-Patcher](https://github.com/openwrt-xiaomi/xmir-patcher) 可以打开原厂 SSH。"
rescue:
  how: TTL 截停启动后输入 `httpd`
  address: 192.168.1.1
recovery:
  - 写入前的备份是唯一的退路。救援页「固件更新」可以把备份的分区原样写回。
  - 启动程序本身损坏时，需要 TTL 加 RAM 试跑包重新进救援页，或者用编程器；先到 QQ 群 1131957442 联系维护者。
links:
  - { text: IPQ50XX-Uboot 仓库, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot" }
  - { text: XMiR-Patcher（开启原厂 SSH 的社区工具）, url: "https://github.com/openwrt-xiaomi/xmir-patcher" }
