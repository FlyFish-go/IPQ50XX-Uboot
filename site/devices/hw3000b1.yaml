id: hw3000b1
order: 22
vendor: 航芯
name: HW3000B1
aliases: [HW3000B1, HW3000B1-ZHJ]
soc: IPQ5018
status: verified
family: HW3000B1
summary: "主板标识 HW3000B1-ZHJ 的路由器，已实机刷入，冷启动 5 次通过。"
brief: "最新构建还没有重刷复测"
artifact: ipq5018_hw3000b1
hardware:
  - { label: 闪存, value: "NAND（FM25LS01，ECC 8 位，U-Boot 自动识别）" }
  - { label: 主板分类, value: "AP-MP03.3，machid `0x8040002`" }
  - { label: 网络, value: "GE 口（WAN）+ QCA8337 交换芯片（LAN），复位 GPIO39" }
  - { label: 无线, value: "QCN6122 + QCN9000" }
tested:
  - "两份 APPSBL 写入，冷启动 5 次通过，原厂系统正常"
  - "ECC 8 位自动识别"
  - "BOOTCONFIG 切到 1 启动，再切回 0 后字节和原来一致"
not_tested:
  - "最新构建（LED 点亮、LAN 优先之后）还没有重刷，只测过更早的构建"
  - "Reset、WPS 按键"
  - "从原厂 SSH 一键安装"
slots:
  mechanism: bootconfig
  note: "原厂用 BOOTCONFIG 选启动槽。"
install:
  method: ttl
notes:
  interrupt: "样机的原厂系统在串口上有 root shell，不需要密码；这一步要的是更早出现的 U-Boot 提示符，注意别错过。"
shell:
  access: "样机的原厂系统在**串口**上有 root shell，但还不知道怎么从网络（Telnet / SSH）拿到。"
rescue:
  how: TTL 截停启动后输入 `httpd`
  address: 192.168.1.1
recovery:
  - 写入前的备份是唯一的退路。救援页「固件更新」可以把备份的分区原样写回。
  - 启动程序本身损坏时，需要 TTL 加 RAM 试跑包重新进救援页，或者用编程器；先到 QQ 群 1131957442 联系维护者。
links:
  - { text: IPQ50XX-Uboot 仓库, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot" }
