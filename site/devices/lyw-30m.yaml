id: lyw-30m
order: 20
vendor: 领研（联通）
name: LYW-30M
aliases: [LYW-30M, 联通 VS010, 联通 VS010 MAX, 电信 CMLYQ706X]
soc: IPQ5018
status: verified
family: 联通 / 领研 LYW-30M
summary: "联通 VS010 家族的原厂硬件，已实机刷入并冷启动通过；LED 和按键没有逐项测。"
brief: "VS010 等同硬件机型没有逐台验证"
artifact: ipq5018_lingyan_lyw_30m
hardware:
  - { label: 闪存, value: "NAND（DS35M1GA，ECC 4 位，U-Boot 自动识别）" }
  - { label: 主板分类, value: "AP-MP03.3，machid `0x8040002`" }
  - { label: 网络, value: "GE 口（LAN）+ QCA8337 交换芯片（WAN 和其余 LAN）" }
  - { label: 安全启动, value: "样机未开启" }
tested:
  - "两份 APPSBL 都用救援页写入，读回校验一致"
  - "冷启动 10 次通过；修复 LED 初始化后重刷，又冷启动 5 次通过"
  - "网口：GE 口和交换芯片口都能进救援页"
  - "从第二套启动链（APPSBL_1）启动 2 次，标志置回 0 后启动 2 次"
  - "BOOTCONFIG 保护：目标副本是空的时拒绝切换"
not_tested:
  - "Reset、WPS 按键"
  - "LED 颜色和闪烁节奏的逐项核对"
  - "从原厂 SSH 一键安装"
warnings:
  - "同硬件但没有逐台验证：联通 VS010、联通 VS010 MAX、电信 CMLYQ706X。这些型号和 LYW-30M 是同一套硬件，**同一硬件，未实机验证**。电信 CMLYQ706X 目前没有任何实物资料，只是型号对得上，尚未确认。"
  - "部分 VS010 MAX 批次可能用 RTL8366 / RTL8367 系列交换芯片，而不是 QCA8337。那样本 U-Boot 的网口会不通。刷入前一定先做 RAM 试跑，确认网口和救援页正常。"
  - "被第三方工具（如 uBootKit）改过 CDT 的联通 VS010，板级 ID 可能不是 `0x8040002`，不适用于本构建。"
slots:
  mechanism: bootconfig
  note: "原厂用 BOOTCONFIG 选启动槽。样机上第二套启动链是空的，U-Boot 会拒绝把标志指向空副本，所以实际只跑第一套。"
install:
  method: ttl
ttl:
  pins: GPIO20/21
  fdt: "0x4a9c4004"
  port: 原厂的 LAN 口（GE 口或交换芯片口都行）
rescue:
  how: TTL 截停启动后输入 `httpd`
  address: 192.168.1.1
recovery:
  - 写入前的备份是唯一的退路。救援页「固件更新」可以把备份的分区原样写回。
  - 启动程序本身损坏时，需要 TTL 加 RAM 试跑包重新进救援页，或者用编程器；先到 QQ 群 1131957442 联系维护者。
links:
  - { text: IPQ50XX-Uboot 仓库, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot" }
