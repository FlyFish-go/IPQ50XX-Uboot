id: cmcc-pz-l8
order: 51
vendor: 中国移动
name: PZ-L8
aliases: [PZ-L8]
soc: IPQ5018
status: untested
family: 中国移动 PZ-L8
summary: "按上游 OpenWrt 和第三方设备树写成的构建。闪存、网口、启动槽都还没在实机上确认，欢迎能接 TTL 的人做 RAM 试跑并反馈。"
brief: "有一种闪存版本（FM25SL01）不支持"
artifact: ipq5018_cmcc_pz_l8-untested
hardware:
  - { label: 主板分类, value: "AP-MP02.1" }
  - { label: 闪存, value: "128 MiB NAND（ESMT F50D1G41LB）" }
  - { label: 网络, value: "内置 GE PHY 直连 QCA8337 的一个口（PHY 到 PHY 的 CPU 链路），交换芯片复位 GPIO26" }
  - { label: 串口, value: "GPIO28/29，PCB 上 4 针过孔（3.3 V、GND、TX、RX）" }
warnings:
  - "这款有另一种闪存版本（FM25SL01），上游不支持，我们的闪存表里也没有。如果你的机器是这个版本，不要刷。"
  - "GE PHY 直连交换芯片的链路在 U-Boot 驱动里是否要特殊处理没验证，RAM 试跑时重点看网口是否能通。"
  - "PCB 上的串口焊盘在黑色散热片中间，3.3 V、GND、TX、RX 的顺序按上游资料，接线前请自己用万用表确认。"
tested:
  - "离线检查：构建通过；设备树与第三方设备树、上游 OpenWrt 的设备树逐项对照过"
not_tested:
  - "RAM 试跑（串口横幅、网口、救援页）"
  - "闪存识别和 ECC"
  - "按键和 LED"
  - "原厂分区表和启动槽机制"
  - "安全启动状态"
  - "GE PHY 与交换芯片的 CPU 链路"
slots:
  mechanism: bootconfig
  note: "原厂分区表里有 BOOTCONFIG 和 rootfs / rootfs_1（上游资料），按 BOOTCONFIG 双系统构建。"
install:
  method: ttl
ttl:
  pins: GPIO28/29
notes:
  wire: "串口焊盘是 PCB 上黑色散热片中间的 4 个过孔（3.3 V、GND、TX、RX，顺序按上游资料）。接线前用万用表自己确认，3.3 V 那个孔不要接。"
  ramboot: "这款有一种 FM25SL01 闪存的版本，我们的闪存表里没有。闪存识别那一行如果是这个型号，就到此为止，不要继续。"
  rescue: "GE PHY 直连交换芯片的链路没验证过，重点看每个网口能不能打开救援页。"
shell:
  access: "上游 OpenWrt 的资料说：通电后按住 Reset 20–30 秒，原厂系统会在 56781 端口开 root shell。没有核实。"
links:
  - { text: IPQ50XX-Uboot 仓库, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot" }
  - { text: 提交试跑报告, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot/issues/new?template=board-report.yml" }
