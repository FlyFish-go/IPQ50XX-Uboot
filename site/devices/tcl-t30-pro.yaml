id: tcl-t30-pro
order: 21
vendor: TCL
name: T30 Pro
aliases: [T30 Pro 1A, T30 Pro 1.5A, QAX3000GE]
soc: IPQ5018
status: verified
family: TCL T30 Pro
summary: "TCL 为运营商定制的 T30 Pro，1A 版和 1.5A 版都已用旧构建（3bc92a2f）实机刷入。最新构建还没有重新刷过，需要复测。"
brief: "要拆一个电阻才能输入；最新构建待复测"
artifact: ipq5018_tcl_t30_pro
hardware:
  - { label: 闪存, value: "128 MiB NAND" }
  - { label: 主板分类, value: "AP-MP02.1，machid `0x8040000`" }
  - { label: 网络, value: "QCA8337 交换芯片，复位 GPIO39" }
  - { label: MAC, value: "原厂把 MAC 以文本形式放在 `factory` 分区，U-Boot 不读写 ART 里的 MAC" }
  - { label: 串口, value: "1.8 V，GPIO20/21" }
tested:
  - "T30 Pro 1A 和 1.5A：都已刷入旧构建（3bc92a2f），两份 APPSBL 写入，冷启动通过"
  - "与原厂 U-Boot 的设备树逐项对照：串口、交换芯片、复位脚一致（只多出本项目自己的 LED、按键节点）"
not_tested:
  - "最新构建（LED 初始化及之后的版本）：1A 和 1.5A 都还没有重新刷过，需要重刷并冷启动复测"
  - "Reset、WPS 按键和 LED"
  - "从原厂 SSH 一键安装"
  - "原厂 `factory` 分区里的 MAC 在救援页的显示"
warnings:
  - "串口 RX 对 GND 有一个电阻，**要拆掉才能输入**：1A 版是 **R5596**，1.5A 版是 **R5600**。"
  - "这是运营商定制机，启动链和通用 IPQ5018 不同，并且多一个 `factory` 分区。请确认你的机器背面铭牌是 T30 Pro，再对照 1A / 1.5A 版本（两个版本的原厂 U-Boot 有差异）。"
  - "串口是 1.8 V。接 3.3 V 的 TTL 适配器会损坏串口脚甚至主芯片，一定要用 1.8 V 电平，或加电平转换。"
slots:
  mechanism: bootconfig
  note: "按 BOOTCONFIG 构建；T30 原厂分区布局下的双系统切换没有逐项验证。"
install:
  method: ttl
ttl:
  voltage: 1.8 V
  pins: GPIO20/21
notes:
  wire: "**要先拆一个电阻才能输入**：T30 Pro 串口的 RX 对 GND 接了一个电阻，不拆的话串口只能看、不能打字。**1A 版拆 R5596，1.5A 版拆 R5600**。拆之前先对照铭牌确认是哪一版。"
  prepare: "先确认机身铭牌是 T30 Pro，并记下是 1A 还是 1.5A 版本（两版原厂 U-Boot 有差异，反馈时要写上）。"
rescue:
  how: TTL 截停启动后输入 `httpd`
  address: 192.168.1.1
recovery:
  - 写入前的备份是唯一的退路。救援页「固件更新」可以把备份的分区原样写回。
  - 启动程序本身损坏时，需要 TTL 加 RAM 试跑包重新进救援页，或者用编程器；先到 QQ 群 1131957442 联系维护者。
links:
  - { text: IPQ50XX-Uboot 仓库, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot" }
