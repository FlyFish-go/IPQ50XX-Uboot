id: glinet-gl-b3000
order: 53
vendor: GL.iNet
name: GL-B3000
aliases: [GL-B3000]
soc: IPQ5018
status: untested
family: GL.iNet GL-B3000
summary: "有构建（第一块用单系统后端的板），没有任何实机验证；价值低，因为原厂 U-Boot 已自带网页救援。"
artifact: ipq5018_glinet_gl_b3000-untested
hardware:
  - { label: 主板分类, value: "AP-MP03.5-C1，machid `0x8040004`" }
  - { label: 闪存, value: "128 MiB NAND（型号和 ECC 未知）" }
  - { label: 网络, value: "QCA8337 交换芯片，复位 GPIO39" }
  - { label: 串口, value: "GPIO20/21" }
warnings:
  - "未验证，不建议刷入。"
  - "交换芯片是 3 个口还是 5 个口，第三方设备树和上游 OpenWrt 不一致，我们按上游写成 3 个口。"
  - "GL.iNet 原厂 U-Boot 自带网页救援，装本 U-Boot 的收益很低，是否收录这块板还没有定。"
  - "原厂分区表没有来源，只知道系统在一个 UBI 分区里。"
tested:
  - "离线检查：构建通过；设备树与第三方设备树、上游 OpenWrt 的设备树逐项对照过"
not_tested:
  - "RAM 试跑（串口横幅、网口、救援页）"
  - "闪存识别和 ECC"
  - "按键和 LED"
  - "原厂分区表和启动槽机制"
  - "安全启动状态"
  - "单系统后端的整体流程"
slots:
  mechanism: single
  note: "单系统，用「单分区」后端。这是第一块用这个后端的板，没有任何实机运行。"
install:
  method: ttl
  label: 仅 RAM 试跑（不要刷入）
steps:
  - title: 先确认你能接受风险
    body: |
      这块板没有在实机上验证过，**不建议刷入**。下面只有 RAM 试跑：把 U-Boot 加载到内存里跑一次，不写任何闪存，断电就恢复原样。
    warn: 未验证，不建议刷入。即使 RAM 试跑一切正常，也不代表可以安全刷入。
  - title: 准备 TTL 串口并做只读备份
    body: |
      接 TTL 串口（115200 8N1，先确认电平，很多机型是 1.8 V）。在原厂系统或原厂 U-Boot 里把分区只读备份到自己电脑上，**备份文件含校准数据和序列号，不要公开上传**。
  - title: 在原厂 U-Boot 里 RAM 试跑
    body: |
      在原厂 U-Boot 提示符下执行 `printenv fdtcontroladdr` 记下地址，再用 `tftpboot 0x44000000 ipq5018_glinet_gl_b3000-untested-ram.uimg` 和 `bootm 0x44000000 - <刚才的地址>` 启动。完整步骤和检查项见[参与收录页的「RAM 试跑」](/contribute/#ram-试跑)。
  - title: 报告结果
    body: |
      无论成功失败，都请用 [board-report 表单](https://github.com/FlyFish-go/IPQ50XX-Uboot/issues/new?template=board-report.yml) 把启动日志、闪存型号和救援页结果告诉我们，这是这块板升到「已验证」的唯一途径。
links:
  - { text: IPQ50XX-Uboot 仓库, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot" }
  - { text: 提交试跑报告, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot/issues/new?template=board-report.yml" }
