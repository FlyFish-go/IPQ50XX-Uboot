id: h3c-rt3000
order: 2
vendor: H3C
name: RT3000
aliases: [RT3000]
soc: IPQ5018
status: verified
family: H3C NX30 家族
summary: H3C NX30 家族，U-Boot 已发布正式版 v0.1.0。不用拆机，在浏览器里用 BootBridge 网页工具安装。
hardware:
  - { label: 硬件组, value: "HW-B 或 HW-C（BootBridge 自动识别）" }
  - { label: 闪存, value: "NAND（多种型号，U-Boot 自动识别 ECC）" }
  - { label: 实机测试, value: "HW-B、HW-C 各一台：全流程" }
slots:
  mechanism: bootconfig
  note: 原厂双系统，由 BOOTCONFIG 选择启动槽。可选把两个槽合并成一个大分区，给第三方固件更多空间。
install:
  method: bootbridge
  oem_firmware: RT3000V100R015
notes:
  model: "RT3000 有 HW-B、HW-C 两种主板，外观一样。不用自己分辨，BootBridge 和救援页都会自动识别。"
rescue:
  how: 断电，按住 Reset 再通电，红灯闪满 3 下后松手
  address: 192.168.10.1
slot_select: 按住 Reset 或 Mesh/WPS 键通电：红灯闪 1 下松手启动一区，闪 2 下松手启动二区，并设为默认。
recovery:
  - 安装前 BootBridge 会完整备份；桥接系统里随时可以返回原厂。
  - 已装本项目 U-Boot 的，救援页里可以写回备份的分区。
  - 万一启动程序本身损坏，需要 TTL 串口或编程器，请先到 QQ 群 1131957442 联系维护者。
links:
  - { text: H3C-NX30-Uboot 仓库（BootBridge 与 v0.1.0）, url: "https://github.com/FlyFish-go/H3C-NX30-Uboot" }
  - { text: v0.1.0 发布说明, url: "https://github.com/FlyFish-go/H3C-NX30-Uboot/releases/tag/uboot-v0.1.0" }
  - { text: 配套固件：QSDK 11.5, url: "https://github.com/FlyFish-go/H3C-RT3000-Product-R1/releases" }
  - { text: 配套固件：OpenWrt + NSS, url: "https://github.com/FlyFish-go/H3C-Magic-NSS/releases" }
