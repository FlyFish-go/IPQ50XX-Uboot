id: cmcc-rax3000q
order: 50
vendor: 中国移动
name: RAX3000Q
aliases: [RAX3000Q, RAX3000QY]
soc: IPQ5018
status: verified
family: 中国移动 RAX3000Q
summary: "中国移动 RAX3000QY 已实机刷入：Dosilicon 闪存自动识别为 ECC 4 位，BOOTCONFIG 双系统，救援页刷固件，冷启动通过。LED 和按键没有测。"
brief: "样机是 Dosilicon 闪存（ECC 4 位，自动识别）；LED 和按键没测"
artifact: ipq5018_cmcc_rax3000q
hardware:
  - { label: 闪存, value: "128 MiB NAND，样机为 Dosilicon DS35M1GA（ECC 4 位，U-Boot 自动识别）" }
  - { label: 内存, value: "256 MiB" }
  - { label: 主板分类, value: "AP-MP02.1" }
  - { label: 网络, value: "QCA8337 交换芯片，复位 GPIO26" }
  - { label: 串口, value: "GPIO28/29" }
  - { label: 安全启动, value: "样机未开启（原厂 `is_sec_boot_enabled`）" }
tested:
  - "RAM 试跑：串口横幅、闪存识别（DS35M1GA，ECC 4 位）、LAN 口救援页"
  - "两份 APPSBL 写入，读回与发布文件（补 0xff）一致"
  - "冷启动多次通过：原厂系统约 40 秒后网页可访问，UBI 无错误"
  - "救援页「固件更新」写入当前启动区，读回与写入前逐字节一致，原厂 U-Boot 能正常启动"
  - "救援页识别出两个原厂系统槽（BOOTCONFIG）"
  - "救援页拒绝其他机型的 U-Boot、旧版本 U-Boot 和厂商升级包"
not_tested:
  - "LED、Reset 和 WPS 按键"
  - "GD5F1GQ5REYIG 闪存的版本（理论上同样自动识别 ECC）"
  - "ART 里的 MAC 位置（样机 ART 开头为空，U-Boot 用默认 MAC，和原厂 U-Boot 相同）"
warnings:
  - "U-Boot 刷入前先用救援页「备份」把所有分区存下来。"
  - "样机 ART 开头没有 MAC，所以救援页不提供写 ART 的入口。"
slots:
  mechanism: bootconfig
  note: "原厂用 BOOTCONFIG 选 rootfs 槽（样机实测）。"
install:
  method: ttl
ttl:
  fdt: "0x4a9c4004"
  interrupt: 原厂 U-Boot 倒数时按任意键
  prompt: "IPQ5018# "
  port: LAN 口
rescue:
  how: TTL 截停启动后输入 `httpd`
  address: 192.168.1.1
recovery:
  - 写入前的备份是唯一的退路。救援页「固件更新」可以把备份的分区原样写回。
  - 启动程序本身损坏时，需要 TTL 加 RAM 试跑包重新进救援页，或者用编程器；先到 QQ 群 1131957442 联系维护者。
links:
  - { text: IPQ50XX-Uboot 仓库, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot" }
  - { text: 提交测试报告, url: "https://github.com/FlyFish-go/IPQ50XX-Uboot/issues/new?template=board-report.yml" }
