vendor: Hangxin
summary: Router with the board marking HW3000B1-ZHJ, flashed on a real unit and passed 5 cold boots.
brief: The newest build has not been reflashed and retested
hardware:
- label: Flash
  value: NAND (FM25LS01, ECC 8 bits, detected automatically by U-Boot)
- label: Board class
  value: AP-MP03.3, machid `0x8040002`
- label: Network
  value: GE port (WAN) + QCA8337 switch (LAN), reset GPIO39
- label: Wireless
  value: QCN6122 + QCN9000
tested:
- Both APPSBL copies written, passed 5 cold boots, stock system normal
- ECC 8 bits detected automatically
- Booted with BOOTCONFIG set to 1, then switched back to 0 and the bytes matched the original
not_tested:
- The newest build (after LED lighting and LAN priority) has not been reflashed; only earlier builds were tested
- Reset and WPS buttons
- One-click install from the stock system over SSH
slots:
  note: Stock uses BOOTCONFIG to select the boot slot.
notes:
  interrupt: The test unit's stock system has a root shell on the serial console, with no password. This step needs the earlier U-Boot prompt, so do not miss it.
shell:
  access: The test unit's stock system has a root shell on the **serial console**, but we do not yet know how to get one over the network (Telnet / SSH).
rescue:
  how: Interrupt boot with TTL, then enter `httpd`
recovery:
- The backup made before writing is the only way back. The rescue page "Firmware Update" can write a backed-up partition back unchanged.
- If the bootloader itself is damaged, use TTL and a RAM trial package to get back to the rescue page, or use a programmer; first contact the maintainer in the QQ group 1131957442.
links:
- text: IPQ50XX-Uboot repository
  url: https://github.com/FlyFish-go/IPQ50XX-Uboot
